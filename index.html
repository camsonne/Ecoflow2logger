<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EcoFlow DELTA 2 Max</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#2a78d6">
<style>
  :root {
    color-scheme: light dark;
    --surface: #fcfcfb;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --border: #e1e0d9;
    --accent: #2a78d6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: #1a1a19;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #898781;
      --border: #2c2c2a;
      --accent: #3987e5;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 48px;
    background: var(--surface);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    justify-content: center;
  }
  main { width: 100%; max-width: 900px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.subtitle { color: var(--text-secondary); margin: 0 0 24px; font-size: 14px; }
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .stat {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
  }
  .stat .label {
    color: var(--text-muted);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }
  .stat .value {
    font-size: 24px;
    font-weight: 600;
    margin-top: 4px;
  }
  img {
    width: 100%;
    height: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
    display: block;
  }
  .updated {
    margin-top: 12px;
    color: var(--text-muted);
    font-size: 13px;
  }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>EcoFlow DELTA 2 Max</h1>
  <p class="subtitle">Charge and power, logged every 15 minutes by <a href="https://github.com/camsonne/Ecoflow2logger">GitHub Actions</a>.</p>

  <div class="stats" id="stats">
    <div class="stat"><div class="label">Charge</div><div class="value" id="stat-soc">–</div></div>
    <div class="stat"><div class="label">Power in</div><div class="value" id="stat-in">–</div></div>
    <div class="stat"><div class="label">Power out</div><div class="value" id="stat-out">–</div></div>
  </div>

  <img src="data/ecoflow_plot.png" alt="EcoFlow charge and power chart" id="chart">
  <p class="updated" id="updated">Loading latest reading…</p>
</main>
<script>
  // Bust caches so the page always shows the latest committed chart/data,
  // and reload periodically so the tab stays live without manual refresh.
  const bust = "?t=" + Date.now();
  document.getElementById("chart").src = "data/ecoflow_plot.png" + bust;

  fetch("data/ecoflow_log.csv" + bust)
    .then((r) => r.text())
    .then((text) => {
      const lines = text.trim().split(/\r\n|\n/);
      if (lines.length < 2) return;
      const header = lines[0].split(",");
      const last = lines[lines.length - 1].split(",");
      const row = Object.fromEntries(header.map((h, i) => [h, last[i]]));

      document.getElementById("stat-soc").textContent =
        row.soc_percent ? `${Number(row.soc_percent).toFixed(0)}%` : "–";
      document.getElementById("stat-in").textContent =
        row.watts_in ? `${Number(row.watts_in).toFixed(0)} W` : "–";
      document.getElementById("stat-out").textContent =
        row.watts_out ? `${Number(row.watts_out).toFixed(0)} W` : "–";
      const lastReadingEt = new Date(row.timestamp).toLocaleString("en-US", {
        timeZone: "America/New_York",
        dateStyle: "medium",
        timeStyle: "medium",
      });
      document.getElementById("updated").textContent =
        `Last reading: ${lastReadingEt} ET (page loaded ${new Date().toLocaleString()})`;
    })
    .catch(() => {
      document.getElementById("updated").textContent =
        "No data yet — waiting on the first workflow run.";
    });

  setInterval(() => location.reload(), 15 * 60 * 1000);

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
