name: Log EcoFlow reading and update chart

on:
  schedule:
    - cron: "*/5 * * * *"  # every 5 min; GitHub only fires schedule triggers from the default branch, and can delay/skip runs under load
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ecoflow-log-and-plot
  cancel-in-progress: false

jobs:
  log-and-plot:
    runs-on: ubuntu-latest
    env:
      # `if:` conditions can't reference `secrets` directly, so this
      # mirrors the secret into an env var the "second device" steps'
      # `if:` checks can read instead.
      HAS_SECOND_DEVICE: ${{ secrets.ECOFLOW_DEVICE_SN_2 != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Read from .python-version so the runner, local checkouts and
          # Dependabot's resolver all agree on one target. numpy and
          # contourpy now require >=3.12, so a 3.11 runner silently makes
          # their pinned versions uninstallable.
          python-version-file: .python-version

      - run: pip install -r requirements.txt

      - name: Poll device and append to log
        env:
          ECOFLOW_ACCESS_KEY: ${{ secrets.ECOFLOW_ACCESS_KEY }}
          ECOFLOW_SECRET_KEY: ${{ secrets.ECOFLOW_SECRET_KEY }}
          # Optional, for accounts on a non-default API region, e.g.
          # https://api-a.ecoflow.com for the Americas. Falls back to the
          # client's default (api-e.ecoflow.com) when unset. Works whether
          # you added it as a repo secret or a repo variable (Settings ->
          # Secrets and variables -> Actions has separate tabs for each;
          # this reads either so it's hard to get wrong).
          ECOFLOW_BASE_URL: ${{ secrets.ECOFLOW_BASE_URL || vars.ECOFLOW_BASE_URL }}
          # Passed as an env var rather than interpolated into the run
          # block below: `${{ }}` substitutes into the script text before
          # bash parses it, so a value containing quotes or $(...) would
          # be re-parsed as shell rather than read as a serial number.
          ECOFLOW_DEVICE_SN: ${{ secrets.ECOFLOW_DEVICE_SN }}
        run: |
          mkdir -p data
          python -m ecoflow_logger log \
            --sn "$ECOFLOW_DEVICE_SN" \
            --csv data/ecoflow_log.csv \
            --iterations 1 \
            -v

      - name: Render chart
        run: python -m ecoflow_logger plot --csv data/ecoflow_log.csv --out data/ecoflow_plot.png

      - name: Poll second device and append to log
        # Skipped until ECOFLOW_DEVICE_SN_2 is added as a repo secret, so
        # merging this doesn't break the workflow for accounts that only
        # monitor one device.
        if: ${{ env.HAS_SECOND_DEVICE == 'true' }}
        env:
          ECOFLOW_ACCESS_KEY: ${{ secrets.ECOFLOW_ACCESS_KEY }}
          ECOFLOW_SECRET_KEY: ${{ secrets.ECOFLOW_SECRET_KEY }}
          ECOFLOW_BASE_URL: ${{ secrets.ECOFLOW_BASE_URL || vars.ECOFLOW_BASE_URL }}
          ECOFLOW_DEVICE_SN_2: ${{ secrets.ECOFLOW_DEVICE_SN_2 }}
        run: |
          mkdir -p data
          python -m ecoflow_logger log \
            --sn "$ECOFLOW_DEVICE_SN_2" \
            --csv data/ecoflow_log_delta2_2.csv \
            --iterations 1 \
            -v

      - name: TEMP debug - dump raw quota for second device
        if: ${{ env.HAS_SECOND_DEVICE == 'true' }}
        env:
          ECOFLOW_ACCESS_KEY: ${{ secrets.ECOFLOW_ACCESS_KEY }}
          ECOFLOW_SECRET_KEY: ${{ secrets.ECOFLOW_SECRET_KEY }}
          ECOFLOW_BASE_URL: ${{ secrets.ECOFLOW_BASE_URL || vars.ECOFLOW_BASE_URL }}
          ECOFLOW_DEVICE_SN_2: ${{ secrets.ECOFLOW_DEVICE_SN_2 }}
        run: |
          python -c "
          import json, os
          from ecoflow_logger.api import EcoFlowClient
          client = EcoFlowClient(
              os.environ['ECOFLOW_ACCESS_KEY'],
              os.environ['ECOFLOW_SECRET_KEY'],
              base_url=os.environ.get('ECOFLOW_BASE_URL') or 'https://api-e.ecoflow.com',
          )
          data = client.get_all_quota(os.environ['ECOFLOW_DEVICE_SN_2'])
          print('quota key count:', len(data))
          for k in sorted(data):
              print(f'{k}={data[k]!r}')
          "

      - name: Render second device chart
        if: ${{ env.HAS_SECOND_DEVICE == 'true' }}
        run: |
          python -m ecoflow_logger plot \
            --csv data/ecoflow_log_delta2_2.csv \
            --out data/ecoflow_plot_delta2_2.png \
            --title "EcoFlow delta2_2"

      - name: Commit updated log and chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ecoflow_log.csv data/ecoflow_plot.png
          git add data/ecoflow_log_delta2_2.csv data/ecoflow_plot_delta2_2.png 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Update EcoFlow log and chart [skip ci]"
          git push
