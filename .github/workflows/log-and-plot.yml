name: Log EcoFlow reading and update chart

on:
  schedule:
    - cron: "*/5 * * * *"  # every 5 min; GitHub only fires schedule triggers from the default branch, and can delay/skip runs under load
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ecoflow-log-and-plot
  cancel-in-progress: false

jobs:
  log-and-plot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Read from .python-version so the runner, local checkouts and
          # Dependabot's resolver all agree on one target. numpy and
          # contourpy now require >=3.12, so a 3.11 runner silently makes
          # their pinned versions uninstallable.
          python-version-file: .python-version

      - run: pip install -r requirements.txt

      - name: Poll every configured device and render its chart
        env:
          ECOFLOW_ACCESS_KEY: ${{ secrets.ECOFLOW_ACCESS_KEY }}
          ECOFLOW_SECRET_KEY: ${{ secrets.ECOFLOW_SECRET_KEY }}
          # Optional, for accounts on a non-default API region, e.g.
          # https://api-a.ecoflow.com for the Americas. Falls back to the
          # client's default (api-e.ecoflow.com) when unset. Works whether
          # you added it as a repo secret or a repo variable (Settings ->
          # Secrets and variables -> Actions has separate tabs for each;
          # this reads either so it's hard to get wrong).
          ECOFLOW_BASE_URL: ${{ secrets.ECOFLOW_BASE_URL || vars.ECOFLOW_BASE_URL }}
          # Comma-separated device serial numbers -- one workflow run polls
          # however many are listed here, in order, rather than needing a
          # separate secret + separate steps per device. Passed as an env
          # var rather than interpolated into the run block below: `${{ }}`
          # substitutes into the script text before bash parses it, so a
          # value containing quotes or $(...) would be re-parsed as shell
          # rather than read as serial numbers.
          ECOFLOW_DEVICE_SNS: ${{ secrets.ECOFLOW_DEVICE_SNS }}
        run: |
          mkdir -p data
          IFS=',' read -ra sns <<< "$ECOFLOW_DEVICE_SNS"
          index=0
          for sn in "${sns[@]}"; do
            sn="$(echo "$sn" | xargs)"  # trim whitespace
            [ -z "$sn" ] && continue
            index=$((index + 1))
            if [ "$index" -eq 1 ]; then
              csv="data/ecoflow_log.csv"
              png="data/ecoflow_plot.png"
              title="EcoFlow DELTA 2 Max"
            else
              csv="data/ecoflow_log_${index}.csv"
              png="data/ecoflow_plot_${index}.png"
              title="EcoFlow Device ${index}"
            fi
            python -m ecoflow_logger log --sn "$sn" --csv "$csv" --iterations 1 -v
            python -m ecoflow_logger plot --csv "$csv" --out "$png" --title "$title"
          done

      - name: Render dashboard pages
        env:
          ECOFLOW_DEVICE_SNS: ${{ secrets.ECOFLOW_DEVICE_SNS }}
        run: python -m ecoflow_logger dashboards --sns "$ECOFLOW_DEVICE_SNS"

      - name: Commit updated log and chart
        run: |
          shopt -s nullglob  # so device*.html expands to nothing (not a literal pathspec) with only 1 device
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ index.html device*.html sw.js
          git diff --cached --quiet || git commit -m "Update EcoFlow log and chart [skip ci]"
          git push
